# Copy to ~/.dbt/profiles.yml. The twin's Postgres is published on a random host port: `docker port astronomy-db 5432`.
twin:
  target: twin
  outputs:
    twin:
      type: postgres
      host: localhost
      port: "{{ env_var('TWIN_PG_PORT', '5432') | as_number }}"
      user: analytics_dbt                 # its own login, so access history attributes it cleanly (D27)
      password: "{{ env_var('TWIN_DBT_PASSWORD') }}"
      dbname: astronomy_db
      schema: analytics
      threads: 2
