version: 2
sources:
  - name: accounting
    schema: accounting
    description: Written by the accounting service from the orders topic (src/accounting/Consumer.cs at demo 3.1.0)
    meta: {urn_prefix: "postgres://astronomy-db/astronomy_db.accounting", tier: 3, owner: team-finance-data}
    tables:
      - name: order
        identifier: order
        quoting: {identifier: true}       # "order" is a reserved word
        columns: [{name: order_id}]
