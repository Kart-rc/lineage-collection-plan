# Acceptance criteria for the 39 work packages, on the reference slice (OpenTelemetry Demo 3.1.0 plus the thin dbt
# model and the complement repo). One source; code/spec_pack.py renders one markdown file per package and checks that
# every requirement is served, every dependency exists, every done-when line is measurable, and every fixture exists.
# Thresholds come from factory/parameters.yaml. Paths starting "planned:" are created by the package named after them.
# Status: DRAFT for gate G1, 27 November 2026.

defaults:
  limits: {build_attempts: 6, wall_clock: 1 working day, cost: recorded}
  always:
    - Every visible scenario traced to this package passes
    - Holdout pass rate at or above the family rate in parameters.yaml (where the package has holdout scenarios)
    - The reviewer agent or the person at G2 reports no open conformance finding
    - No writes outside the package's own paths and its tests; no network access beyond the twin

work_packages:

# ------------------------------------------------------------------ wave 0: oracle and twin
- id: WP-00
  name: Constitution and spec pack skeleton
  wave: 0
  family: platform
  level: people
  serves: []
  depends: []
  scope: The factory folder itself - constitution, parameters, requirements, interfaces, work packages, visible scenarios - and the checker that keeps them consistent.
  inputs: [docs/06-element-lineage-factory-spec.md, docs/08-build-decisions.md]
  outputs: [factory/, code/spec_pack.py]
  must_hold:
    - Protected paths (factory/oracle, factory/parameters.yaml, policies) change only through a person's merge
    - Every requirement ID in requirements.yaml is served by at least one package and traced by at least one visible scenario
  done_when:
    - "`python3 code/spec_pack.py --check` reports 0 errors"
    - "41 of 41 requirements served by a work package and traced by a visible scenario"
    - "Gate G1 signed by the approver (D20)"
  fixtures: [factory/specs/requirements.yaml, factory/parameters.yaml]

- id: WP-01
  name: Golden graph at element level, as fixtures
  wave: 0
  family: oracle
  level: people
  serves: [BL-1, BL-6]
  depends: [WP-00]
  scope: The truth the build is graded against - service, field, flag-gated and flag edges on the demo, plus the dbt hop.
  inputs: [demo at 3.1.0, fixtures/otel-demo-3.1.0/dbt]
  outputs: [fixtures/otel-demo-3.1.0/golden-graph.json, fixtures/otel-demo-3.1.0/dbt/golden-dbt.json]
  must_hold:
    - Every edge cites a file, line and text fragment, or is hand-written from SQL by a person
    - Nothing in the golden graph is generated by a tool under test
  done_when:
    - "`python3 code/reference_slice.py --check <demo>` reports 0 citations failing (89 today)"
    - "100% of golden nodes have an owner and a tier in catalog.yaml"
    - "Gate G3 signed, including the frontend -> currency edge added after the first run"
  fixtures: [fixtures/otel-demo-3.1.0/golden-graph.json, fixtures/otel-demo-3.1.0/dbt/golden-dbt.json, fixtures/otel-demo-3.1.0/catalog.yaml]

- id: WP-02
  name: Change and incident replay corpora, visible and holdout split
  wave: 0
  family: oracle
  level: people
  serves: [IA-8, IR-5]
  depends: [WP-01]
  scope: At least 20 changes and 20 incidents, each with its expected outcome, split by family; the holdout third written and kept by people outside the build's reach.
  inputs: [fixtures/otel-demo-3.1.0/change-replay.json, fixtures/otel-demo-3.1.0/incident-scenarios.json, factory/oracle/holdout/README.md]
  outputs: [fixtures/otel-demo-3.1.0/change-replay.json, fixtures/otel-demo-3.1.0/incident-scenarios.json, holdout store (outside this repository)]
  must_hold:
    - Holdout cases are written by someone who does not build, and are not readable from build sandboxes
    - The four examples named in D15 are public and count as visible; holdout cases must differ from them
  done_when:
    - "At least 20 changes and 20 incidents across the families in parameters.yaml, at least 1/3 of each family in holdout"
    - "100% of cases have a base, a trigger and an expected outcome a script can compare"
    - "Owners and the platform lead sign the corpora"
  fixtures: [fixtures/otel-demo-3.1.0/change-replay.json, fixtures/otel-demo-3.1.0/incident-scenarios.json, factory/oracle/holdout/README.md]

- id: WP-03
  name: Twin of the slice
  wave: 0
  family: platform
  level: 2
  serves: [IN-10, IA-1]
  depends: [WP-00]
  scope: One command starts the demo with the capture add-on and the separate lineage platform (Kafka for evidence, Neo4j, Postgres for aliases and queues, a Parquet archive), and flips flags with logged change events.
  inputs: [fixtures/otel-demo-3.1.0/run/, fixtures/otel-demo-3.1.0/dbt/]
  outputs: [planned:twin/compose.yaml, planned:twin/flip.py]
  must_hold:
    - Lineage traffic never uses the demo's own Kafka (D23)
    - Works in a sandbox without IPv6 or ulimit (sandbox.override.yaml)
    - A flag with a targeting rule is flipped through the rule's branch, as flagd-ui does, not through its default variant (the second run's I6 attempt changed productCatalogFailure's default and injected nothing)
  done_when:
    - "Cold start to all containers healthy in 15 minutes or less, 3 of 3 attempts"
    - "Smoke run: observed service edges score precision >= 0.95 against the golden graph after 10 minutes of load"
    - "Every flag flip and service stop or start is logged as a CHANGE_EVENT that validates against envelope-v2.schema.json"
  fixtures: [fixtures/otel-demo-3.1.0/run/sandbox.override.yaml, fixtures/otel-demo-3.1.0/run/otelcol-capture.yml]

- id: WP-04
  name: Scoring harness lineage-eval
  wave: 0
  family: platform
  level: 2
  serves: [BL-6, BL-7, IA-8, IR-5]
  depends: [WP-01, WP-02]
  scope: The oracle's executable part - score, replay changes, replay incidents, run holdout - built from code/observed_edges.py and code/run_checks.py.
  inputs: [code/observed_edges.py, code/run_checks.py, fixtures/otel-demo-3.1.0/]
  outputs: [planned:factory/oracle/harness/lineage_eval/]
  must_hold:
    - A person reads every line; it is the oracle
    - Deterministic - the same inputs give the same scores
  done_when:
    - "`lineage-eval score` on the 27 November capture reproduces precision 1.00 and recall 0.90 on service edges"
    - "`lineage-eval replay incidents` on run 1 reproduces I1 detection at 2.0 minutes and paymentFailure ranked first"
    - "3 consecutive runs on the same inputs give identical output files (byte for byte)"
    - "The holdout runner's output contains 0 case texts: only a pass rate and failure categories per family"
  fixtures: [fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json, fixtures/otel-demo-3.1.0/capture-2026-11-27/checks-run.json]

# ------------------------------------------------------------------ wave 1: core semantics
- id: WP-10
  name: URN library with nested field paths
  wave: 1
  family: core_semantics
  level: 2
  serves: [BL-1]
  depends: [WP-00]
  scope: Parse, format and normalize every URN kind in D4 plus flag:// and otel:// (D29, D30), with nested and repeated field paths.
  inputs: [fixtures/otel-demo-3.1.0/golden-graph.json, fixtures/otel-demo-3.1.0/aliases.json]
  outputs: [planned:core/urn/]
  must_hold:
    - format(parse(x)) == x for every canonical URN
    - Quoted identifiers normalize one way (accounting."order" and accounting.order resolve to the same node)
  done_when:
    - "Property test: 10,000 generated URNs round-trip with 0 failures"
    - "100% of the URNs in golden-graph.json and golden-dbt.json parse"
  fixtures: [fixtures/otel-demo-3.1.0/golden-graph.json]

- id: WP-11
  name: Envelope v2 schema and emit library
  wave: 1
  family: core_semantics
  level: 2
  serves: [BL-2, BL-4, XC-1, XC-2, XC-3]
  depends: [WP-10]
  scope: The emit library every collector imports; it validates against envelope-v2.schema.json, sets weights from parameters.yaml and sends asynchronously.
  inputs: [factory/specs/evidence/interfaces/envelope-v2.schema.json, factory/parameters.yaml]
  outputs: [planned:collectors/evidence/]
  must_hold:
    - Collectors cannot set their own weight
    - No payload values - the library rejects any field outside the schema (XC-1)
    - Emission is asynchronous and droppable (XC-3)
  done_when:
    - "100% of the schema's examples validate and 100% of the invalid examples are rejected"
    - "v1 events from doc 03 upgrade to v2 with no field lost (fixture round trip)"
    - "With the evidence broker stopped, a producer's p99 latency rises by less than 1 ms and nothing raises"
  fixtures: [factory/specs/evidence/interfaces/envelope-v2.schema.json, factory/specs/evidence/examples/]

- id: WP-12
  name: Merge and scorer with unit-owned static evidence; conditional edges with a latent state
  wave: 1
  family: core_semantics
  level: 2
  serves: [BL-5, IN-2, IN-8, IN-9, IA-7, XC-2]
  depends: [WP-11]
  scope: One row per edge per source; noisy-OR confidence and states from parameters.yaml; unit replacement; mass-close hold; dormancy; disputes; conditions and latent state (D30).
  inputs: [factory/parameters.yaml]
  outputs: [planned:core/merge/]
  must_hold:
    - Static evidence is replaced per unit as one atomic set; runtime evidence only adds
    - An indirect dependency is stored once per (source element, subtype, target dataset)
  done_when:
    - "Property tests: noisy-OR monotonic, merge idempotent and order-independent, 0 failures over 1,000 generated event sequences"
    - "Mass-close hold triggers at more than 20% of an extractor's edges and at least 10 edges, and not below"
    - "Change C7: 5 latent edges become active on the flag event and latent again when it is reverted"
    - "BL-5 size check on fct_order_value: exactly 5 indirect edges stored, not 35"
  fixtures: [fixtures/otel-demo-3.1.0/dbt/golden-dbt.json, fixtures/otel-demo-3.1.0/change-replay.json]

- id: WP-13
  name: Bitemporal graph writer and as-of reads, on Neptune over Bolt with Neo4j standing in locally
  wave: 1
  family: core_semantics
  level: 2
  serves: [BL-7, IN-4, IN-5, IN-10, IR-2]
  depends: [WP-12]
  scope: Write each edge version as its own relationship with valid and recorded times, condition and state; read as of any valid or recorded time.
  inputs: [factory/specs/changes/interfaces/lineage-changes.schema.json]
  outputs: [planned:core/graph/]
  must_hold:
    - No edge version is ever updated in place
    - Only the openCypher subset Neptune supports
  done_when:
    - "Bitemporal property tests: 0 failures on Neo4j and on a stage Neptune, and 100% agreement between the two on the as-of suite"
    - "Rebuild from the raw archive gives the live graph's hash, 3 of 3 times"
    - "Merge or run to visible edge in 15 minutes or less at p95 in the twin"
  fixtures: [fixtures/otel-demo-3.1.0/change-replay.json]

- id: WP-14
  name: Lineage diff and the lineage.changes stream
  wave: 1
  family: core_semantics
  level: 2
  serves: [IN-6]
  depends: [WP-13]
  scope: Diff between two times or commits with causes; one lineage.changes event per material change.
  inputs: [factory/specs/changes/interfaces/lineage-changes.schema.json, factory/specs/query-api/interfaces/openapi.yaml]
  outputs: [planned:core/diff/]
  must_hold:
    - Redelivered evidence produces no new change event
  done_when:
    - "Diffs for C3, C4, C5 and C7 equal the hand-written expected diffs exactly"
    - "100% of emitted events validate against lineage-changes.schema.json"
  fixtures: [fixtures/otel-demo-3.1.0/change-replay.json]

- id: WP-15
  name: Identity resolver at element level, never aliasing an IP
  wave: 1
  family: core_semantics
  level: 2
  serves: [BL-1]
  depends: [WP-10]
  scope: Map every name a collector sees to one URN through the alias table and its rules (D31).
  inputs: [fixtures/otel-demo-3.1.0/aliases.json]
  outputs: [planned:core/resolve/]
  must_hold:
    - An IP address is never an alias
    - A shared database login is never used for attribution (D27)
  done_when:
    - "55 of 55 distinct names in the first capture resolve or are declared non-entities; 0 IP addresses aliased"
    - "0 duplicate nodes after resolving both captures into the golden graph"
  fixtures: [fixtures/otel-demo-3.1.0/aliases.json, fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json]

- id: WP-16
  name: Daily reconciler and owner queues
  wave: 1
  family: core_semantics
  level: 2
  serves: [IA-7]
  depends: [WP-12, WP-17]
  scope: Queue static-only, runtime-only, declared-never-seen and disagreeing edges to the owner in catalog.yaml.
  inputs: [fixtures/otel-demo-3.1.0/catalog.yaml]
  outputs: [planned:core/reconcile/]
  must_hold:
    - One queue item per edge per day, however often it is seen
  done_when:
    - "From the first capture the queue holds exactly: frontend -> currency and frontend -> shipping (static only), and 6 services that read a flag with no flagd span"
    - "100% of queue items carry an owner"
  fixtures: [fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json, fixtures/otel-demo-3.1.0/catalog.yaml]

- id: WP-17
  name: Owner and tier overlay from the catalog file and service criticality
  wave: 1
  family: core_semantics
  level: 2
  serves: [IA-4, XC-5]
  depends: [WP-10]
  scope: OWNS edges at weight 0.50, tiers, and personal-data tags from the contracts' classification.
  inputs: [fixtures/otel-demo-3.1.0/catalog.yaml, fixtures/otel-demo-3.1.0/contracts/]
  outputs: [planned:collectors/catalog/]
  must_hold:
    - Tiers follow service.criticality (critical 1, high 2, medium and low 3)
  done_when:
    - "100% of golden nodes have an owner and a tier"
    - "100% of columns classified personal in the contracts are tagged personal on their nodes"
  fixtures: [fixtures/otel-demo-3.1.0/catalog.yaml, fixtures/otel-demo-3.1.0/contracts/accounting.contract.yaml]

- id: WP-19
  name: "Service edge builder: trace walk, topic joins, ingress logs"
  wave: 1
  family: extractors
  level: 2
  serves: [BL-6, XC-3]
  depends: [WP-11, WP-15]
  scope: CALLS from the parent-child span walk, PRODUCES and CONSUMES joined on the topic, ingress from Envoy by upstream cluster, flagd calls as configuration reads (D7, D8, D29).
  inputs: [code/observed_edges.py, fixtures/otel-demo-3.1.0/aliases.json]
  outputs: [planned:collectors/service_edges/]
  must_hold:
    - Reads exported telemetry only; never sits in a request path
  done_when:
    - "On both captures: service and topic edges precision >= 0.95 and recall >= 0.90; 13 of 13 upstream-asserted edges"
    - "2 of 2 Kafka consumers found by topic join, with 0 trace links used"
    - "100% of calls to flagd scored as control edges; 0 as data edges"
  fixtures: [fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json, fixtures/otel-demo-3.1.0/golden-graph.json]

# ------------------------------------------------------------------ wave 2: element extractors
- id: WP-20
  name: dbt and SQL extractor
  wave: 2
  family: extractors
  level: 3
  serves: [BL-2, BL-3, BL-4, BL-5, IN-3]
  depends: [WP-10, WP-11]
  scope: Read a dbt project at a commit and emit envelope v2 evidence for every model, with SQLGlot.
  inputs: [fixtures/otel-demo-3.1.0/dbt/, jaffle-shop (read-only corpus)]
  outputs: [planned:extractors/dbt_sql/]
  must_hold:
    - SQLGlot only; no hand-written SQL parsing
    - SELECT * expands against the input schema as of the commit
    - An unresolved model emits an opaque edge with a reason code; it never raises
  done_when:
    - "Thin dbt model: precision and recall >= 0.90 against golden-dbt.json (30 direct, 5 indirect)"
    - "Metamorphic suite (alias rename, CTE reorder, reformat): 100% identical edges and expression hashes"
    - "jaffle-shop: precision >= 0.90 on the sample a person labels in WP-02"
  fixtures: [fixtures/otel-demo-3.1.0/dbt/golden-dbt.json, fixtures/otel-demo-3.1.0/dbt/models/]

- id: WP-21
  name: Protobuf schema differ and registry watcher
  wave: 2
  family: extractors
  level: 3
  serves: [BL-1, IN-3, IA-2]
  depends: [WP-10, WP-11]
  scope: Turn compiled descriptors into field nodes for every message on the slice; diff two versions into change kinds; publish schema-change events.
  inputs: [pb/demo.proto at 3.1.0 and at the commits of C1 and C2]
  outputs: [planned:extractors/protobuf/]
  must_hold:
    - Field identity is the field number within its message, not its name
  done_when:
    - "100% of golden api:// and kafka:// element nodes exist as fields"
    - "C1 is reported as retyped (int32 to string, wire-incompatible); C2 as a package rename, wire-compatible"
    - "A schema-change event is published within 1 minute of a descriptor change in the twin"
  fixtures: [fixtures/otel-demo-3.1.0/change-replay.json]

- id: WP-22
  name: "Stream job extractor: PyFlink code and the declared feature registry first"
  wave: 2
  family: extractors
  level: 3
  serves: [BL-3, BL-4]
  depends: [WP-11]
  scope: Field edges for the complement's PyFlink job from its declared feature registry and code; opaque edges for what neither declares.
  inputs: [satyazm/Fraud-Detection-using-MLOps at d1692f9]
  outputs: [planned:extractors/stream/]
  must_hold:
    - A transform neither declared nor parsed is opaque, never guessed
  done_when:
    - "Precision and recall >= 0.90 against the golden edges a person writes from src/fraud_detection/features/registry.py in WP-01"
  fixtures: [planned:fixtures/complement/golden.json (WP-01)]

- id: WP-23
  name: Service producer and consumer field scanner
  wave: 2
  family: extractors
  level: 3
  serves: [BL-2, BL-3, BL-4]
  depends: [WP-10, WP-11, WP-21]
  scope: Field-to-field assembly inside services - the Go code in checkout first, then Kotlin and the other languages; rules per framework.
  inputs: [demo src/checkout at 3.1.0]
  outputs: [planned:extractors/service_fields/]
  must_hold:
    - A service in a language without rules emits opaque edges (UNPARSED_LANGUAGE), never nothing
  done_when:
    - "Checkout: precision and recall >= 0.90 on its 18 golden field edges, including the card pass-through to payment"
    - "0 edges from any credit_card field to the orders topic (must-not-flow)"
    - "The 5 flag-gated edges carry the condition flag://otel-demo/emitRawPii == on"
  fixtures: [fixtures/otel-demo-3.1.0/golden-graph.json]

- id: WP-24
  name: Sink and ORM writer extractor, C# Entity Framework first
  wave: 2
  family: extractors
  level: 3
  serves: [BL-2, BL-3]
  depends: [WP-10, WP-11]
  scope: Map ORM entity properties to table columns and the consumed message fields that fill them (accounting).
  inputs: [demo src/accounting at 3.1.0]
  outputs: [planned:extractors/orm/]
  must_hold:
    - Column names follow the ORM's naming convention (snake_case in accounting)
  done_when:
    - "Precision and recall >= 0.95 on the 17 golden accounting edges"
    - "The written columns agree 17 of 17 with the columns seen in accounting's database spans"
  fixtures: [fixtures/otel-demo-3.1.0/golden-graph.json, fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json]

- id: WP-25
  name: Feature repository and training config extractor
  wave: 2
  family: extractors
  level: 3
  serves: [BL-3]
  depends: [WP-11, WP-22]
  scope: Feast feature views to source columns, entity keys and aggregations; MLflow model signature to features.
  inputs: [satyazm/Fraud-Detection-using-MLOps at d1692f9]
  outputs: [planned:extractors/features/]
  must_hold:
    - Feature edges carry the aggregation window when there is one
  done_when:
    - "Precision and recall >= 0.90 on the complement's golden feature and model edges"
  fixtures: [planned:fixtures/complement/golden.json (WP-01)]

- id: WP-26
  name: "Access-history collector at column level: Postgres first, then Snowflake and Databricks"
  wave: 2
  family: extractors
  level: 3
  serves: [BL-3, XC-1]
  depends: [WP-11, WP-15]
  scope: Database client spans first, pg_stat_statements for clients without spans, statements parsed with SQLGlot down to columns; adapters for Snowflake ACCESS_HISTORY and Databricks lineage tables follow (D22, D27).
  inputs: [code/observed_edges.py, recorded query fixtures]
  outputs: [planned:collectors/access_history/]
  must_hold:
    - Never attributes by login; never stores a literal or parameter value
  done_when:
    - "Accounting writes 3 tables and 17 of 17 golden columns; product-catalog reads 8 columns of catalog.products"
    - "100% of the dbt job's reads attribute to analytics_dbt; 0 to astronomy_user"
    - "A scan of the stored evidence finds 0 parameter values"
  fixtures: [fixtures/otel-demo-3.1.0/capture-2026-11-27/observed-edges.json]

- id: WP-27
  name: OpenLineage ingestion with column facets
  wave: 2
  family: extractors
  level: 3
  serves: [XC-4]
  depends: [WP-11]
  scope: Accept and emit OpenLineage run events with the column lineage facet, from Feast and dbt.
  inputs: [OpenLineage events from the complement's Feast and from dbt-ol]
  outputs: [planned:collectors/openlineage/]
  must_hold:
    - Class and subtype survive the round trip
  done_when:
    - "Round trip in and out: 100% of fixture events equal after normalization, class and subtype included"
  fixtures: [planned:fixtures/openlineage/ (WP-27)]

- id: WP-28
  name: BI metadata extractor
  wave: 2
  family: extractors
  level: 3
  serves: [BL-3]
  depends: [WP-11]
  scope: Fields a dashboard uses. The reference slice has no BI tool; the dbt exposure stands in until slice 2 names one.
  inputs: [fixtures/otel-demo-3.1.0/dbt/models/marts/exposures.yml]
  outputs: [planned:extractors/bi/]
  must_hold:
    - A dashboard whose fields cannot be read gets a dataset-level opaque edge
  done_when:
    - "The exposure finance_orders_dashboard is linked to fct_order_value (1 of 1)"
    - "Blocked for field level until slice 2 names a BI tool; then precision and recall >= 0.90 on recorded API fixtures"
  fixtures: [fixtures/otel-demo-3.1.0/dbt/models/marts/exposures.yml]

- id: WP-29
  name: Model-assisted extractor for opaque units, with a verifier
  wave: 2
  family: extractors
  level: 2
  serves: [BL-4, XC-6]
  depends: [WP-11, WP-23]
  scope: Candidate evidence for units no rule can read (the Ruby email service, templates); a verifier checks every edge against real schemas.
  inputs: [opaque units listed by WP-23]
  outputs: [planned:extractors/model_assisted/]
  must_hold:
    - Its edges stay candidate unless another source confirms them
    - Only source code and schemas leave through the approved endpoint (D19)
  done_when:
    - "The verifier rejects 100% of proposed edges whose fields do not exist in the schemas"
    - "Precision >= 0.80 on accepted edges against the golden graph"
    - "100% of events record model, prompt version and output hash; the egress allow-list test passes"
  fixtures: [fixtures/otel-demo-3.1.0/golden-graph.json]

# ------------------------------------------------------------------ wave 3: incremental and impact
- id: WP-30
  name: Change detectors and unit invalidation
  wave: 3
  family: impact
  level: 3
  serves: [IN-1, IN-3, IN-10]
  depends: [WP-12, WP-20, WP-21]
  scope: Re-extract only the units whose content, input schema or extractor version changed; on a schema change, every reader.
  inputs: [git history of the demo and the dbt model]
  outputs: [planned:core/invalidate/]
  must_hold:
    - A unit whose hashes are unchanged is never re-extracted
  done_when:
    - "C1 replay: extractor calls equal exactly the units whose hashes changed"
    - "A column added to accounting.shipping re-extracts stg_shipping and reaches it with 1 new edge"
    - "Merge to visible edge in 15 minutes or less at p95 in the twin"
  fixtures: [fixtures/otel-demo-3.1.0/dbt/models/staging/stg_shipping.sql, fixtures/otel-demo-3.1.0/change-replay.json]

- id: WP-31
  name: PR overlay and impact query API
  wave: 3
  family: impact
  level: 3
  serves: [IN-7, IA-4, IA-9]
  depends: [WP-13, WP-14]
  scope: Hold a PR's static evidence in an overlay; answer /impact for a PR or for a change described before any PR exists.
  inputs: [factory/specs/query-api/interfaces/openapi.yaml]
  outputs: [planned:services/impact/]
  must_hold:
    - The production graph's hash does not change while a PR is open
  done_when:
    - "Overlay isolation: production graph hash unchanged across 100% of overlay scenarios"
    - "/impact for C1 lists accounting.shipping#zip_code, shipping, frontend and load-generator, each with owner, tier, state and confidence"
