- id: WP-42
  name: "RCA ranker: narrow to the failing callee, then rank"
  wave: 4
  family: detect_resolve
  level: 3
  serves: [IR-1, IR-2, IR-3, IR-4, IR-5]
  depends: [WP-13, WP-40, WP-41]
