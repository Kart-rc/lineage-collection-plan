name: lineage-twin
services:
  lineage-kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: bGluZWFnZS10d2luLTAwMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://lineage-kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lineage-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["lineage-kafka:/var/lib/kafka/data"]
    networks: [lineage]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
  lineage-neo4j:
    image: neo4j:5.26.19-community
    environment:
      NEO4J_AUTH: neo4j/lineage-local-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:17687:7687", "127.0.0.1:17474:7474"]
    volumes: ["lineage-neo4j:/data"]
    networks: [lineage]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -u neo4j -p lineage-local-only 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s
  lineage-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lineage
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage-local-only
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - lineage-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/lineage.sql:ro
    networks: [lineage]
    healthcheck:
      test: [CMD, pg_isready, -U, lineage, -d, lineage]
      interval: 5s
      timeout: 5s
      retries: 30
networks:
  lineage: {}
volumes:
  lineage-kafka: {}
  lineage-neo4j: {}
  lineage-postgres: {}
  lineage-archive: {}

